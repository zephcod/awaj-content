name: Facebook queue cron

# Publishes due Facebook posts (lib/fbqueue.ts) by hitting the app's cron
# endpoint. Facebook's own native scheduler is no longer used for new
# posts — it silently throttles once a Page has ~30 pending scheduled
# posts — so this is the only thing that publishes queued FB posts when
# the in-process worker (instrumentation.ts) isn't running continuously.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://scheduler.awajet.com  (no trailing slash)
#   CRON_SECRET  must match CRON_SECRET in the app's env
#   (same secrets already used by ig-cron.yml — nothing new to add if
#   that workflow is already configured)
#
# Can also be triggered manually from the Actions tab (workflow_dispatch).

on:
  schedule:
    # Every 5 minutes, on the :00 mark — the baseline offset that
    # ig-cron.yml (+1 min) and li-cron.yml (+2 min) stagger against, so
    # the three don't all queue for a runner at the exact same instant.
    # That simultaneous contention was causing intermittent "cancelled,
    # never got a runner" failures. GitHub's practical minimum interval
    # is 5 min; actual runs are still best-effort and can land late
    # under load regardless of the offset.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  publish-due:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish due Facebook posts
        run: |
          set -e
          resp=$(curl -fsS --max-time 480 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/fb")
          echo "Response: $resp"
